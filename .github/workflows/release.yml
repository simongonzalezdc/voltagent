name: Release

on:
  push:
    branches:
      - main

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - cli
          - core
          - create-voltagent-app
          - docs-mcp
          - internal
          - logger
          - postgres
          - supabase
          - voice
          - server-core
          - libsql
      fail-fast: false
    name: Test ${{ matrix.package }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Set package scope
        id: scope
        run: |
          if [[ "${{ matrix.package }}" == "create-voltagent-app" ]]; then
            echo "scope=create-voltagent-app" >> $GITHUB_OUTPUT
          else
            echo "scope=@voltagent/${{ matrix.package }}" >> $GITHUB_OUTPUT
          fi
      - name: Build Package and Dependencies
        run: lerna run build --scope "${{ steps.scope.outputs.scope }}" --include-dependencies
      - name: Test Package
        run: lerna run test --scope "${{ steps.scope.outputs.scope }}"

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Build E2E Dependencies
        run: pnpm lerna run build --scope @voltagent/e2e --include-dependencies
      - name: Run E2E Tests
        run: pnpm --filter @voltagent/e2e test

  publish:
    needs: [test-packages, e2e-tests]
    permissions:
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-stable-release
      cancel-in-progress: true
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: voltagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3
        with:
          token: ${{ secrets.VOLTAGENT_BOT }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            //registry.npmjs.org/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install Dependencies
        run: pnpm install
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
      - name: Build
        run: pnpm build:all
      - name: Lint with Biome
        run: pnpm lint:ci
      - name: Syncpack
        run: pnpm sp lint
      - name: Publint
        run: pnpm publint:all
     # - name: Are The Types Wrong
     #   run: pnpm attw:all

      - name: PostgreSQL Integration Tests
        run: |
          cd packages/postgres
          npm run test:integration:ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/voltagent_test
      
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d  # v1
        with:
          version: pnpm version-packages
          publish: pnpm changeset publish
          commit: "ci(changesets): version packages"
          title: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.VOLTAGENT_BOT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
